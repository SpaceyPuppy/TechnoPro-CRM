name: Backend CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backend/**"
      - "packages/shared/**"
      - "deploy/**"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.10
        env:
          MYSQL_DATABASE: technopro_test
          MYSQL_USER: technopro
          MYSQL_PASSWORD: ci-database-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: technopro_test
      DB_USER: technopro
      DB_PASSWORD: ci-database-password
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v7
      - name: Check deployment script syntax
        run: |
          bash -n deploy/install.sh
          bash -n deploy/scripts/caddy-watchdog.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@technopro/shared
      - run: npm run build --workspace=backend
      - run: npm run db:migrate --workspace=backend
      - run: npm test --workspace=backend
      - run: docker build --target api -f backend/Dockerfile -t technopro-api:ci .
      - run: docker build --target migration -f backend/Dockerfile -t technopro-migration:ci .
      - run: docker compose --env-file deploy/.env.example -f deploy/compose.vps.yml config --quiet
