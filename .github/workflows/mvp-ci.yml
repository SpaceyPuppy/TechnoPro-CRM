name: MVP CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.10
        env:
          MYSQL_DATABASE: technopro_test
          MYSQL_USER: technopro
          MYSQL_PASSWORD: ci-database-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: technopro_test
      DB_USER: technopro
      DB_PASSWORD: ci-database-password
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@technopro/shared
      - run: npm run build --workspace=backend
      - run: npm run db:migrate --workspace=backend
      - run: npm test --workspace=backend
      - run: docker build --target api -f backend/Dockerfile -t technopro-api:ci .
      - run: docker build --target migration -f backend/Dockerfile -t technopro-migration:ci .
      - run: docker compose --env-file deploy/.env.example -f deploy/compose.vps.yml config --quiet

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: chmod +x flutter/android/gradlew
      - working-directory: flutter
        run: flutter pub get
      - working-directory: flutter
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - working-directory: flutter
        run: flutter test
      - working-directory: flutter
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: technopro-android-debug
          path: flutter/build/app/outputs/flutter-apk/app-debug.apk
