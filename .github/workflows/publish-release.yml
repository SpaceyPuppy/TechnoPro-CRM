name: Publish TechnoPro release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: technopro-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.10
        env:
          MYSQL_DATABASE: technopro_release
          MYSQL_USER: technopro
          MYSQL_PASSWORD: release-database-password
          MYSQL_ROOT_PASSWORD: release-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prelease-root-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: technopro_release
      DB_USER: technopro
      DB_PASSWORD: release-database-password
      JWT_SECRET: release-only-jwt-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mvp:check
      - run: npm run db:migrate --workspace=backend
      - run: docker compose --env-file deploy/.env.example -f deploy/compose.vps.yml config --quiet

  android:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Configure release signing
        working-directory: flutter
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_STORE_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/technopro-release.p12
          {
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=technopro-release.p12\n'
            printf 'storeType=%s\n' "${ANDROID_KEYSTORE_TYPE:-PKCS12}"
          } > android/key.properties
      - run: chmod +x flutter/android/gradlew
      - working-directory: flutter
        run: flutter pub get
      - working-directory: flutter
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - working-directory: flutter
        run: flutter test
      - name: Build signed release APK
        working-directory: flutter
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          build_name="${version%%-*}"
          flutter build apk --release --build-name "$build_name" --build-number "$GITHUB_RUN_NUMBER"
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/technopro-${version}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: technopro-android-release
          path: flutter/build/app/outputs/flutter-apk/technopro-*-android.apk
          if-no-files-found: error

  containers:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      api-image: ${{ steps.names.outputs.api }}
      migration-image: ${{ steps.names.outputs.migration }}
      version: ${{ steps.names.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        name: Resolve image names
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="${GITHUB_REF_NAME#v}"
          echo "api=ghcr.io/${owner}/technopro-crm-api" >> "$GITHUB_OUTPUT"
          echo "migration=ghcr.io/${owner}/technopro-crm-migration" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.api }}:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.api }}:mvp
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}
      - name: Publish migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: migration
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.migration }}:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.migration }}:mvp
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}

  server-bundle:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package VPS deployment files
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          root="release/technopro-server-${version}"
          mkdir -p "$root/deploy/scripts" "$root/docs"
          cp deploy/compose.vps.yml "$root/deploy/"
          cp deploy/Caddyfile "$root/deploy/"
          cp deploy/.env.example "$root/deploy/"
          cp deploy/RELEASE-README.md "$root/README.md"
          cp deploy/scripts/backup.sh deploy/scripts/restore.sh "$root/deploy/scripts/"
          cp docs/vps-docker-deployment.md "$root/docs/"
          tar -C release -czf "release/technopro-server-${version}.tar.gz" "technopro-server-${version}"
      - uses: actions/upload-artifact@v4
        with:
          name: technopro-server-release
          path: release/technopro-server-*.tar.gz
          if-no-files-found: error

  release:
    needs: [android, containers, server-bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum technopro-* > SHA256SUMS.txt
      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          body: |
            Android-first TechnoPro Service MVP test release.

            - Install `technopro-*-android.apk` on the Android phone.
            - Extract `technopro-server-*.tar.gz` on the VPS and follow its `README.md`.
            - API image: `${{ needs.containers.outputs.api-image }}:${{ needs.containers.outputs.version }}`.
            - Migration image: `${{ needs.containers.outputs.migration-image }}:${{ needs.containers.outputs.version }}`.

            Verify `SHA256SUMS.txt` before installation. Keep this as a prerelease until the end-to-end workflow and backup restore drill pass.
          files: |
            release-assets/technopro-*-android.apk
            release-assets/technopro-server-*.tar.gz
            release-assets/SHA256SUMS.txt
